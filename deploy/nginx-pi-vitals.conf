# Pi Vitals site. Installed by deploy/install.sh to /etc/nginx/sites-available/pi-vitals
# (or conf.d/pi-vitals.conf) with the marked placeholders filled in. Nginx serves the static
# dashboard and proxies /api to the backend, which listens on 127.0.0.1 only.

# Basic-auth brute-force and runaway-client guard (this file is included inside `http {}`)
limit_req_zone $binary_remote_addr zone=pivitals:1m rate=20r/s;

server {
    listen @BIND@:@PORT@;
    server_name _;
    server_tokens off;

    root @PREFIX@/frontend;
    index index.html;

    # Everything here exposes ports and config: require a login
    auth_basic "Pi Vitals";
    auth_basic_user_file @HTPASSWD@;

    limit_req zone=pivitals burst=40 nodelay;

    # style-src needs 'unsafe-inline' because the UI sets a few inline style attributes
    # (meter widths); scripts are not allowed inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # add_header is not inherited into a location that sets its own, so locations below use
    # `expires` for cache headers instead.

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    location /api/ {
        # The app is read-only, so refuse anything but reads at the edge as well
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        expires -1;
    }

    location /fonts/ {
        expires 30d;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        # Revalidate (cheap, ETag-based) so an upgrade is picked up immediately
        expires -1;
        try_files $uri $uri/ =404;
    }
}
