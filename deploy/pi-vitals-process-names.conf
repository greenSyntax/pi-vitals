# OPTIONAL systemd drop-in, installed by `install.sh --process-names` to
# /etc/systemd/system/pi-vitals.service.d/process-names.conf
#
# Without it, the Ports tab shows process names only for processes owned by the service user,
# because Linux hides other users' /proc/<pid>/fd. CAP_SYS_PTRACE lets the service read them,
# so the Ports tab can name sshd, nginx and so on.
#
# Trade-off: CAP_SYS_PTRACE is a powerful capability (it allows inspecting any process).
# Only enable it if you want process names and accept that.
[Service]
AmbientCapabilities=CAP_SYS_PTRACE
